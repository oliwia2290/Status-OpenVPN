<!DOCTYPE html>
<html data-theme="dark">
<head>
<meta charset="utf-8">
<title>OpenVPN status</title>

<style>
:root {
  --bg-color: #ffffff;
  --text-main: #666666;
  --text-header: #000000;
  --border-color: #f0f0f0;
  --row-hover: #f5f5f5;
  --status-red: #e74c3c;
  --status-green: #2ecc71;
  --status-orange: #ffa500;
}

[data-theme="dark"] {
  --bg-color: #1a1a1a;
  --text-main: #bbbbbb;
  --text-header: #ffffff;
  --border-color: #333333;
  --row-hover: #2d2d2d;
}

body {
  background-color: var(--bg-color);
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: var(--text-main);
  -webkit-font-smoothing: antialiased;
}

.table-container {
  position: absolute;
  top: 3vh;
  left: 3vh;
  right: 3vh;
  bottom: 3vh;
  overflow: auto;
}

table {
  border-collapse: separate;
  border-spacing: 0;
  min-width: 100%;
  font-size: 13px;
}

thead th {
  position: sticky;
  top: 0;
  z-index: 10;
  background-color: var(--bg-color);
  color: var(--text-header);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 12px 20px;
  border-bottom: 2px solid var(--border-color);
  white-space: nowrap;
}

thead th:first-child {
  width: 54px;
  min-width: 54px;
  padding: 0;
}

th:nth-child(2), td:nth-child(2) { width: 15px; }
th:nth-child(3), td:nth-child(3) { width: 40px; }
th:nth-child(4), td:nth-child(4) { width: 40px; }
th:nth-child(5), td:nth-child(5) { width: 30px; }
th:nth-child(6), td:nth-child(6) { width: 30px; }
th:nth-child(7), td:nth-child(7) { width: 50px; }
th:nth-child(8), td:nth-child(8) { width: 50px; }
th:nth-child(9), td:nth-child(9) { width: 70px; }

td {
  background-color: var(--bg-color);
  color: var(--text-main);
  font-size: 13px;
  padding: 10px 20px;
  border-bottom: 1px solid var(--border-color);
  white-space: nowrap;
}

tbody tr:nth-child(even) td {
  background-color: var(--bg-color);
}

tbody tr:hover td {
  background-color: var(--row-hover);
}

td:first-child {
  padding: 0;
  position: relative;
  width: 54px;
  min-width: 54px;
}

td:first-child::before {
  content: "";
  position: absolute;
  inset: 0;
  margin: auto;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--status-red);
}

tr.active td:first-child::before {
  background: var(--status-green);
}

tr.inactive td:first-child::before {
  background: var(--status-red);
}

tr.is_degraded td:first-child::before {
  background: var(--status-orange);
}

.active,
.inactive {
  background-color: transparent;
}

.net-icon {
  width: 18px;
  height: 18px;
  border: 1px solid var(--text-main);
  border-radius: 50%;
  margin: auto;
  position: relative;
  animation: rotateNet 4s linear infinite;
}

.net-icon::before {
  content: "";
  position: absolute;
  top: 0;
  left: 25%;
  width: 50%;
  height: 100%;
  border-left: 1px solid var(--text-main);
  border-right: 1px solid var(--text-main);
  border-radius: 50%;
}

.net-icon::after {
  content: "";
  position: absolute;
  top: 48%;
  left: 0;
  width: 100%;
  height: 1px;
  background: var(--text-main);
}

@keyframes rotateNet {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.status-color {
  font-weight: bold;
  color: var(--status-red);
}

.btn {
  width: 85px;
  text-align: center;
  color: white;
  border: none;
  padding: 6px 10px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
}

.btn.block { background-color: var(--status-green); }
.btn.unblock { background-color: var(--status-red); }

button.restart {
  background-color: var(--status-red);
  color: white;
  border: none;
  padding: 6px 10px;
  cursor: pointer;
  border-radius: 4px;
  font-weight: 600;
  transition: background 0.2s ease, transform 0.1s ease;
}

button.restart:hover { filter: brightness(0.9); }
button.restart:active { transform: scale(0.97); }

button.restart:disabled,
.btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  pointer-events: none;
}

.table-container::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

.table-container::-webkit-scrollbar-track {
  background: var(--bg-color);
}

.table-container::-webkit-scrollbar-thumb {
  background: var(--border-color);
  border-radius: 4px;
}

th:nth-child(10),
td:nth-child(10) {
  text-align: center;
}
tr.empty-row td:first-child::before {
  content: none;
}
tr.empty-row td {
  height: 3px;
}
</style>
</head>
<body>
<div class="table-container">
  <div id="controls"></div>

  <table>
    <thead>
      <tr>
        <th><div class="net-icon"></div></th>
        <th></th>
        <th>Client</th>
        <th>VPN IP</th>
        <th>Public IP</th>
        <th>MB Received</th>
        <th>MB Sent</th>
        <th>Connected Since</th>
        <th>Last Seen</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="tbl"></tbody>
  </table>
</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
